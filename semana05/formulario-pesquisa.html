<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
    <title>Document</title>
</head>

<body>

    <header>
        <h1>WDD - 130 | Formulário HTML - Pesquisa de Usuário</h1>
    </header>

    <main>
        <form>

            <fieldset>
                <legend>Informações de contato</legend>
                <div class="item-formulario coluna2">
                    <label for="nome-completo">Nome Completo</label>
                    <input type="text" id="nome-completo" name="nome-completo" required>
                </div>
                <div class="item-formulario coluna2">
                    <label for="email">E-mail</label>
                    <input type="email" id="emaildosuario" name="emaildousario" required>
                </div>

            </fieldset>

            <!-- <label for="quantidade">Selecione uma Quantidade</label>
            <select name="quantidade" id="quantidade">
                <option value="1">Um</option>
                <option value="2">Dois</option>
                <option value="2">Três</option>
            </select> -->

            <fieldset>
                <legend>Perguntas</legend>

                <div class="item-formulario coluna1">
                    <label for="navegador">Qual é seu navegador favorito?</label>

                    <select name="navegador" id="navegador">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="edge">Edge</option>
                    </select>
                </div>

                <div class="item-formulario coluna1">
                    <label for="pet">Você tem um animal de estimação?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>

                <div>
                    <label for="feedback">Liste os lugares onde morou:</label>

                    <textarea name="feedback" id="feedback"
                        rows="4">Fortaleza -CE, Florianópolis - SC, Vitória - ES</textarea>
                </div>
            </fieldset>
            <button type="submit">Enviar Pesquisa</button>

        </form>
    </main>

    <footer>

    </footer>
</body>

</html>
