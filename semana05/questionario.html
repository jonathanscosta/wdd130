<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/questionario.css">
    <title>Questionário de HTML</title>
</head>

<body>

    <header>
        <h1>Questionário de HTML</h1>
    </header>

    <main>
        <form>

            <label for="q1">1. O que significa HTML?</label>
            <input type="text" id="q1" name="q1">

            <label for="q2">2. Qual atalho usando para criar uma classe na div, descreva um exemplo</label>
            <textarea name="q2" id="q2" rows="4"></textarea>

            <label for="q3">3. Qual das opções abaixo é uma classe no CSS?</label>
            <select name="q3" id="q3">
                <option value="" selected disabled>Escolha uma opçao</option>
                <option value="2">#nome-da-classe {}</option>
                <option value="3">*nome-da-classe {}</option>
                <option value="4">.nome-da-classe {}</option>
            </select>

            <label for="q4">4. Qual a margem inferior no CSS?</label>
            <h5>margin: 10px 20px 5px 15px</h5>
            <input type="number" name="q4" id="q4">
            <button type="submit">Enviar Questionário</button>

        </form>
    </main>
</body>

</html>
